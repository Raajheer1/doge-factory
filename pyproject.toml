[project]
name = "doge-factory-voice-agents"
version = "0.1.0"
description = "Voice agents for the DOGE Factory Mobilize step"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
console = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
voice-agents = "voice_agents.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice_agents*"]

[tool.setuptools.package-data]
voice_agents = ["fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
